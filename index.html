<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2f6f5e">
    <meta name="description" content="A Nordic Yatzy PWA game with solo, computer opponent, and CPU match modes.">
    <title>Yatzy</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/yatzy-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/yatzy-maskable.svg">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell" aria-labelledby="game-title">
      <section class="game-panel" aria-label="Yatzy board" data-i18n-aria-label="boardLabel">
        <header class="top-bar">
          <div class="title-stack">
            <p class="eyebrow" data-i18n="eyebrow">Nordic Yatzy</p>
            <h1 id="game-title" data-i18n="title">Yatzy</h1>
          </div>
          <div class="top-controls">
            <div class="language-switcher" aria-label="Language" data-i18n-aria-label="languageSelectorLabel">
              <button class="language-button" type="button" data-lang="zh-Hant" lang="zh-Hant">繁中</button>
              <button class="language-button" type="button" data-lang="en" lang="en">English</button>
              <button class="language-button" type="button" data-lang="sv" lang="sv">Svenska</button>
            </div>
            <div class="score-summary" aria-label="Score summary" data-i18n-aria-label="scoreSummaryLabel">
              <div>
                <span id="total-label">Total</span>
                <strong id="total-score">0</strong>
              </div>
              <div>
                <span id="secondary-label">Best</span>
                <strong id="best-score">0</strong>
              </div>
            </div>
          </div>
        </header>

        <section class="play-area" aria-label="Dice controls" data-i18n-aria-label="playAreaLabel">
          <div class="mode-tabs" aria-label="Game mode" data-i18n-aria-label="modeTabsLabel">
            <button class="mode-button is-active" type="button" data-mode="solo">Solo</button>
            <button class="mode-button" type="button" data-mode="vsComputer">Vs Computer</button>
            <button class="mode-button" type="button" data-mode="watch">Watch CPUs</button>
          </div>

          <div id="players-board" class="players-board" aria-label="Players" data-i18n-aria-label="playersLabel"></div>

          <div class="turn-meter">
            <div>
              <span class="label" data-i18n="rollsLabel">Rolls</span>
              <strong id="roll-count">0 / 3</strong>
            </div>
            <div>
              <span class="label" data-i18n="remainingLabel">Remaining</span>
              <strong id="remaining-count">15</strong>
            </div>
            <div>
              <span class="label" data-i18n="bonusLabel">Bonus</span>
              <strong id="bonus-state">0 / 50</strong>
            </div>
          </div>

          <div id="dice-tray" class="dice-tray" aria-label="Dice" data-i18n-aria-label="diceLabel"></div>

          <div class="actions">
            <button id="roll-button" class="primary-action" type="button">Roll Dice</button>
            <button id="auto-button" class="ghost-action" type="button" hidden>Pause</button>
            <button id="restart-button" class="ghost-action" type="button">Restart</button>
          </div>

          <p id="turn-message" class="turn-message" role="status" aria-live="polite"></p>
          <div id="turn-log" class="turn-log" aria-label="Recent turns" data-i18n-aria-label="recentTurnsLabel"></div>
          <p id="pwa-status" class="pwa-status" role="status" aria-live="polite" hidden></p>
        </section>
      </section>

      <section class="score-card" aria-label="Score card" data-i18n-aria-label="scoreCardLabel">
        <div class="score-card-header">
          <div>
            <h2 data-i18n="scoreCardTitle">Score Card</h2>
            <p id="score-card-subtitle">You</p>
          </div>
          <div>
            <span data-i18n="upperLabel">Upper</span>
            <strong id="upper-score">0</strong>
          </div>
        </div>
        <div id="score-table" class="score-table"></div>
      </section>
    </main>

    <script src="game.js" defer></script>
  </body>
</html>
